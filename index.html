<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="项目组协作空间入口">
  <meta name="referrer" content="no-referrer">
  <title>协作空间</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f7f7f4;color:#27332a;display:flex;flex-direction:column}
    header{padding:32px clamp(24px,6vw,96px);font-size:13px;letter-spacing:.08em;color:#69776d}
    header span{display:inline-grid;place-items:center;width:28px;height:28px;margin-right:12px;background:#526b59;color:white;border-radius:6px;font:600 16px Georgia,serif;vertical-align:middle}
    main{flex:1;display:grid;place-items:center;padding:35px 24px 90px}
    .entry{width:min(100%,520px);background:#fff;border:1px solid #e7ebe5;border-radius:12px;padding:clamp(30px,5vw,52px);box-shadow:0 14px 48px #2639270a}
    .eyebrow{font-size:11px;color:#829081;letter-spacing:.14em;text-transform:uppercase}
    h1{font-size:clamp(30px,5vw,40px);font-weight:600;letter-spacing:.04em;margin:22px 0 13px}
    p{font-size:15px;line-height:1.8;color:#69766c;margin:0}
    a{display:inline-flex;align-items:center;justify-content:space-between;gap:48px;min-width:185px;margin-top:40px;padding:14px 18px;background:#526b59;color:white;border-radius:6px;text-decoration:none;font-size:14px;font-weight:600}
    a:hover,a:focus-visible{background:#3d5745}
    a:focus-visible{outline:3px solid #9fb7a2;outline-offset:3px}
    .note{margin-top:24px;font-size:12px;color:#98a49a}
    footer{padding:0 clamp(24px,6vw,96px) 28px;font-size:12px;color:#98a49a}
  </style>
</head>
<body>
  <header><span aria-hidden="true">T</span>协作空间</header>
  <main>
    <section class="entry" aria-labelledby="title">
      <div class="eyebrow">MEMBER ACCESS</div>
      <h1 id="title">进入工作台</h1>
      <p>项目组成员请使用已分配的访问码登录。</p>
      <a href="https://guides-invoice-length-hypothetical.trycloudflare.com/" rel="noreferrer">继续 <span aria-hidden="true">↗</span></a>
      <div class="note">登录页将通过 HTTPS 打开。</div>
    </section>
  </main>
  <footer>项目组协作入口</footer>
</body>
</html>
